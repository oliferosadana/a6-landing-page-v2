server {
    listen 80;
    listen [::]:80;
    server_name amandabrownies-kalimantan.store www.amandabrownies-kalimantan.store; # Ganti dengan domain Anda

    root /var/www/amanda-brownies-v2/dist;
    index index.html;

    # Gzip Compression untuk kecepatan loading
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static Assets Cache (File js, css, gambar dalam /assets/ di-cache 1 tahun)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Favicon, robots.txt, sitemap, dan file verifikasi Google Search Console
    location ~* \.(ico|svg|xml|txt|html)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA Routing (Mencegah error 404 saat refresh halaman /admin atau /cs)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Opsional: Reverse Proxy jika menjalankan server WhatsApp WAHA di VPS yang sama (port 3000)
    # location /waha/ {
    #     proxy_pass http://127.0.0.1:3000/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection 'upgrade';
    #     proxy_set_header Host $host;
    #     proxy_cache_bypass $http_upgrade;
    # }
}
